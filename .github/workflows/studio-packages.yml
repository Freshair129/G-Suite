name: Studio packages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/**'
      - 'schemas/**'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/studio-packages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  event-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This crate tree matches G-Maiden 6a26d62 (taxonomy v1.1).
      - uses: actions/checkout@v4
        with:
          ref: 62ee66b51da5709e827093cf023d5e68a9bb6db8
          path: legacy
          sparse-checkout: packages/ann-studio/src-tauri/gann-package
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --manifest-path legacy/packages/ann-studio/src-tauri/gann-package/Cargo.toml
      - run: cargo test --locked --manifest-path packages/ann-studio/src-tauri/gann-package/Cargo.toml --test install event_taxonomy_install_matrix -- --ignored --exact
        env:
          GANN_V11_CLI: ${{ github.workspace }}/legacy/packages/ann-studio/src-tauri/gann-package/target/debug/g-ann-package
  frontends:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        package: [ann-studio/src, 3d-studio]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/${{ matrix.package }} build
      - if: matrix.package == 'ann-studio/src'
        run: pnpm -C packages/ann-studio/src test
      - if: matrix.package == 'ann-studio/src'
        run: pnpm -C packages/ann-studio/src exec playwright install chromium --only-shell
      - if: matrix.package == 'ann-studio/src'
        run: pnpm -C packages/ann-studio/src test:responsive
  studio-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm 3d-studio:build:fe
      - run: pnpm 3d-studio:test
      - run: cargo fmt --check --manifest-path packages/3d-studio/src-tauri/Cargo.toml
      - run: cargo check --locked --manifest-path packages/3d-studio/src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path packages/3d-studio/src-tauri/Cargo.toml
  ann-studio-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/ann-studio/src build
      - run: node tools/prepare-ann-media.mjs
      - run: cargo fmt --check --manifest-path packages/ann-studio/src-tauri/Cargo.toml
      - run: cargo check --locked --manifest-path packages/ann-studio/src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path packages/ann-studio/src-tauri/Cargo.toml
      - name: Round-trip a Studio-produced Banner Asset through AnnStudio and reopen
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./tools/test-banner-roundtrip.ps1
  banner-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm banner-contracts:test
